<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact</title>
	<style>
		/* The device with borders */
		.tablet {
		  /* position: relative; */
		  margin: auto;
		  border: 16px black solid;
		  border-top-width: 60px;
		  border-bottom-width: 60px;
		  border-radius: 36px;
		  margin-bottom: 40px;
		}
		
		/* The screen (or content) of the device */
		.tablet, .tablet .content {
		  width: 640px;
		  height: 480px;
		  background: white;
		}

		/* The device with borders */
		.smartphone {
			position: relative;
			margin: auto;
			border: 16px black solid;
			border-top-width: 60px;
			border-bottom-width: 60px;
			border-radius: 36px;
		}

		/* The horizontal line on the top of the device */
		/* .smartphone:before {
		content: '';
		display: block;
		width: 60px;
		height: 5px;
		position: absolute;
		top: -30px;
		left: 50%;
		transform: translate(-50%, -50%);
		background: #333;
		border-radius: 10px;
		} */

		/* The circle on the bottom of the device */
		.smartphone:after {
			content: '';
			display: block;
			width: 35px;
			height: 35px;
			position: absolute;
			left: 50%;
			bottom: -65px;
			transform: translate(-50%, -50%);
			background: #333;
			border-radius: 50%;
		}

		/* The screen (or content) of the device */
		.smartphone, .smartphone .content {
			width: 360px;
			height: 640px;
			background: white;
		}
	</style>
</head>
<body>
	<h1>Contact Us</h1>
	<p id="demo">These are all my projects</p>
	<button type="button" onclick="myFunction()">Try it</button>
	<div class="tablet">
		<div class="content">
		  <iframe src="/index.html" style="width:100%; border:none; height:100%"></iframe>
		</div>
	</div>
	<div class="smartphone">
		<div class="content">
		  <iframe src="/index.html" style="width:100%; border:none; height:100%"></iframe>
		</div>
	</div>
</body>
</html>
